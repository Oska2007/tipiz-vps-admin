<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIPIZ VPS Admin</title>
    <style>
      body {
        background: #080b14;
        color: #e8ecf5;
        font-family: system-ui, sans-serif;
        padding: 20px;
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
      }
      .card {
        background: #0f1424;
        padding: 25px;
        border-radius: 16px;
        border: 1px solid #1e2a4a;
        margin-bottom: 20px;
      }
      h2 {
        color: #4f8cff;
        margin-bottom: 20px;
        text-align: center;
      }
      .nav {
        text-align: center;
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .nav a {
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        background: #1e2a4a;
        border-radius: 8px;
      }
      .nav a.active {
        background: #4f8cff;
      }

      /* Dynamic Row Styles */
      .job-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: start;
        background: #0a0f1c;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        border: 1px solid #1e2a4a;
      }
      .job-row input[type="text"],
      .job-row input[type="url"],
      .job-row input[type="file"] {
        width: 100%;
        padding: 10px;
        background: #0f1424;
        border: 1px solid #1e2a4a;
        color: white;
        border-radius: 6px;
        font-size: 13px;
        box-sizing: border-box;
      }
      .job-row label {
        font-size: 11px;
        color: #8b96b5;
        display: block;
        margin-bottom: 4px;
      }
      .btn-remove {
        background: #ef4444;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        height: 100%;
      }
      .btn-add {
        background: #22c55e;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 20px;
        width: 100%;
        font-size: 15px;
      }
      .btn-submit {
        background: linear-gradient(90deg, #4f8cff, #7c3aed);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        font-size: 16px;
      }

      /* Progress UI */
      .job-item {
        background: #0a0f1c;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        border-left: 4px solid #4f8cff;
      }
      .job-title {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 5px;
      }
      .job-status {
        font-size: 13px;
        color: #8b96b5;
        margin-bottom: 10px;
      }
      .progress-bar {
        height: 6px;
        background: #1e2a4a;
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: #22c55e;
        width: 0%;
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <!-- අමතර බටන්ස් අයින් කරලා තියෙන්නේ මෙතන -->
        <a href="/" class="active">Process Videos</a>
        <a href="/logout" style="background: #ef4444">Logout</a>
      </div>

      <div class="card">
        <h2>Batch Video Processing</h2>
        <div id="rows-container">
          <!-- Rows will be added here by JS -->
        </div>

        <button type="button" class="btn-add" onclick="addRow()">
          + Add Another Video (Max 10)
        </button>

        <button
          type="button"
          class="btn-submit"
          onclick="submitBatch()"
          id="btnSubmit"
        >
          Start Processing Queue
        </button>
      </div>

      <div class="card">
        <h2>Live Processing Queue</h2>
        <div id="jobsList">
          <p style="color: #8b96b5; text-align: center">No active jobs.</p>
        </div>
      </div>
    </div>

    <script>
      let rowCount = 0;
      let nextRowId = 1;

      function addRow() {
        if (rowCount >= 10)
          return alert("Maximum 10 videos allowed per batch.");

        const id = nextRowId++;
        rowCount++;
        const container = document.getElementById("rows-container");
        const div = document.createElement("div");
        div.className = "job-row";
        div.id = `row-${id}`;
        div.innerHTML = `
        <div>
          <label>Video Title</label>
          <input type="text" id="title-${id}" placeholder="e.g. The Dog Stars" required>
        </div>
        <div>
          <label>Direct Link (MP4/MKV)</label>
          <input type="url" id="url-${id}" placeholder="https://..." required>
        </div>
        <div>
          <label>Subtitle 1 (Sinhala - Default)</label>
          <input type="file" id="sub1-${id}" accept=".srt,.vtt">
        </div>
        <div>
          <label>Subtitle 2 (English - Optional)</label>
          <input type="file" id="sub2-${id}" accept=".srt,.vtt">
        </div>
        <div style="display:flex; align-items:center; height:100%;">
          <button type="button" class="btn-remove" onclick="removeRow(${id})">X</button>
        </div>
      `;
        container.appendChild(div);
      }

      function removeRow(id) {
        const row = document.getElementById(`row-${id}`);
        if (row) {
          row.remove();
          rowCount--;
        }
      }

      async function submitBatch() {
        const btn = document.getElementById("btnSubmit");
        btn.disabled = true;
        btn.textContent = "Starting...";

        const formData = new FormData();
        let titles = [];
        let urls = [];
        let hasData = false;

        const rows = document.querySelectorAll(".job-row");
        for (const row of rows) {
          const id = row.id.replace("row-", "");
          const title = document.getElementById(`title-${id}`).value.trim();
          const url = document.getElementById(`url-${id}`).value.trim();
          const sub1 = document.getElementById(`sub1-${id}`).files[0];
          const sub2 = document.getElementById(`sub2-${id}`).files[0];

          if (title && url) {
            titles.push(title);
            urls.push(url);
            if (sub1) formData.append(`sub1_${titles.length - 1}`, sub1);
            if (sub2) formData.append(`sub2_${titles.length - 1}`, sub2);
            hasData = true;
          }
        }

        if (!hasData) {
          alert("Please add at least one video.");
          btn.disabled = false;
          btn.textContent = "Start Processing Queue";
          return;
        }

        formData.append("titles", JSON.stringify(titles));
        formData.append("urls", JSON.stringify(urls));

        try {
          const res = await fetch("/api/process-batch", {
            method: "POST",
            body: formData,
            headers: { Accept: "application/json" },
          });

          const contentType = res.headers.get("content-type") || "";
          if (!res.ok) {
            if (contentType.includes("application/json")) {
              const data = await res.json();
              if (res.status === 401) {
                window.location.href = "/login.html";
                throw new Error(data.error || "Session expired. Please log in again.");
              }
              throw new Error(data.error || `Request failed (${res.status})`);
            }
            throw new Error(
              `Server returned an unexpected response (${res.status}).`,
            );
          }

          if (!contentType.includes("application/json")) {
            throw new Error("Server returned an unexpected response. Please refresh and try again.");
          }

          const data = await res.json();
          if (data.ok) {
            document.getElementById("rows-container").innerHTML = "";
            rowCount = 0;
            addRow(); // Add one empty row for next time
            fetchStatus();
          } else throw new Error(data.error);
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Start Processing Queue";
        }
      }

      // Live Polling
      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function fetchStatus() {
        try {
          const res = await fetch("/api/status", {
            headers: { Accept: "application/json" },
          });
          const contentType = res.headers.get("content-type") || "";
          if (res.status === 401) {
            window.location.href = "/login.html";
            return;
          }
          if (!res.ok || !contentType.includes("application/json")) {
            return;
          }
          const jobs = await res.json();
          const list = document.getElementById("jobsList");

          if (jobs.length === 0) {
            list.innerHTML =
              '<p style="color:#8b96b5; text-align:center;">No active jobs.</p>';
            return;
          }

          list.innerHTML = jobs
            .map(
              (job) => `
          <div class="job-item">
            <div class="job-title">${escapeHtml(job.title)}</div>
            <div class="job-status">${escapeHtml(job.status)}</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${job.progress}%"></div></div>
          </div>
        `,
            )
            .join("");
        } catch (e) {
          console.error(e);
        }
      }

      setInterval(fetchStatus, 3000);
      addRow(); // Initial row
      fetchStatus();
    </script>
  </body>
</html>
