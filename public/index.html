<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIPIZ VPS Admin</title>
    <style>
      body {
        background: #080b14;
        color: #e8ecf5;
        font-family: system-ui, sans-serif;
        padding: 40px 20px;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      .card {
        background: #0f1424;
        padding: 30px;
        border-radius: 16px;
        border: 1px solid #1e2a4a;
        margin-bottom: 20px;
      }
      h2 {
        color: #4f8cff;
        margin-bottom: 20px;
        text-align: center;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #8b96b5;
        font-size: 14px;
      }
      input[type="text"],
      input[type="url"],
      input[type="file"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        background: #0a0f1c;
        border: 1px solid #1e2a4a;
        color: white;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(90deg, #4f8cff, #7c3aed);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      .nav {
        text-align: center;
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .nav a {
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        background: #1e2a4a;
        border-radius: 8px;
      }
      .nav a.active {
        background: #4f8cff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a href="/" class="active">Process New Video</a>
        <a href="/assign.html">Assign Videos</a>
        <a href="/backup.html">Backup DB</a>
        <a href="/logout" style="background: #ef4444">Logout</a>
      </div>

      <div class="card">
        <h2>Process New Video</h2>
        <form id="processForm">
          <label>Movie / Episode Title</label>
          <input
            type="text"
            id="title"
            required
            placeholder="e.g. The Dog Stars"
          />

          <label>Direct Video Link (MP4/MKV)</label>
          <input
            type="url"
            id="url"
            required
            placeholder="https://example.com/video.mp4"
          />

          <label>Upload Subtitle File (.srt / .vtt) - Optional</label>
          <input type="file" id="subtitleFile" accept=".srt,.vtt" />

          <button type="submit" id="btnSubmit">Start Processing</button>
        </form>
        <div
          id="status"
          style="
            margin-top: 20px;
            text-align: center;
            color: #86efac;
            font-weight: bold;
          "
        ></div>
      </div>
    </div>

    <script>
      document.getElementById("processForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btnSubmit");
        const status = document.getElementById("status");

        btn.disabled = true;
        btn.textContent = "Starting Job...";
        status.textContent = "";

        const formData = new FormData();
        formData.append("title", document.getElementById("title").value);
        formData.append("url", document.getElementById("url").value);

        const subFile = document.getElementById("subtitleFile").files[0];
        if (subFile) formData.append("subtitle", subFile);

        try {
          const res = await fetch("/api/process", {
            method: "POST",
            body: formData,
          });
          const data = await res.json();

          if (data.ok) {
            status.style.color = "#86efac";
            status.textContent = "✅ Job started! Check VPS Logs.";
            document.getElementById("processForm").reset();
          } else {
            throw new Error(data.error);
          }
        } catch (err) {
          status.style.color = "#fca5a5";
          status.textContent = "❌ " + err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = "Start Processing";
        }
      };
    </script>
  </body>
</html>
