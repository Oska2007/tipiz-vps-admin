<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIPIZ VPS Admin</title>
    <style>
      body {
        background: #080b14;
        color: #e8ecf5;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #0f1424;
        padding: 40px;
        border-radius: 16px;
        border: 1px solid #1e2a4a;
        text-align: center;
        max-width: 500px;
      }
      h1 {
        color: #4f8cff;
        margin-bottom: 10px;
      }
      p {
        color: #8b96b5;
        font-size: 14px;
      }
      .status {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 16px;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid #22c55e;
        color: #86efac;
        border-radius: 99px;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>TIPIZ VPS Admin</h1>
      <p>
        Welcome to the new Advanced Admin Panel.<br />This will handle direct
        links, transcoding, and uploads.
      </p>
      <div class="status">✓ Server is running on Port 3000</div>
    </div>
  </body>
</html>
