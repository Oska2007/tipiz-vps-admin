<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIPIZ VPS Admin</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!-- අපි පස්සේ මේක හදමු -->
    <style>
      body {
        background: #080b14;
        color: #e8ecf5;
        font-family: system-ui, sans-serif;
        padding: 40px;
      }
      .card {
        background: #0f1424;
        padding: 30px;
        border-radius: 16px;
        border: 1px solid #1e2a4a;
        max-width: 600px;
        margin: 0 auto;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        background: #0a0f1c;
        border: 1px solid #1e2a4a;
        color: white;
        border-radius: 8px;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #4f8cff;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background: #3b7bff;
      }
      .log-box {
        background: #000;
        color: #0f0;
        font-family: monospace;
        padding: 15px;
        height: 200px;
        overflow-y: auto;
        margin-top: 20px;
        border-radius: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Process New Video (Direct Link)</h2>
      <form id="processForm">
        <label>Video Title:</label>
        <input
          type="text"
          id="title"
          required
          placeholder="e.g. The Dog Stars"
        />

        <label>Direct Link (MP4/MKV):</label>
        <input
          type="url"
          id="url"
          required
          placeholder="https://example.com/video.mp4"
        />

        <label>Subtitle Link (Optional .srt/.vtt):</label>
        <input
          type="url"
          id="subtitle"
          placeholder="https://example.com/subs.srt"
        />

        <button type="submit" id="btnSubmit">Start Processing</button>
      </form>

      <h3 style="margin-top: 20px">Progress Log:</h3>
      <div class="log-box" id="log">Ready...</div>
    </div>

    <script>
      document.getElementById("processForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btnSubmit");
        const logBox = document.getElementById("log");

        btn.disabled = true;
        btn.textContent = "Processing... (Check Logs)";
        logBox.innerHTML += "<br>🚀 Sending request to server...";

        try {
          const res = await fetch("/api/process", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: document.getElementById("title").value,
              url: document.getElementById("url").value,
              subtitleUrl: document.getElementById("subtitle").value,
            }),
          });
          const data = await res.json();
          logBox.innerHTML += `<br>✅ Server started job: ${data.jobId}`;

          // පස්සේ අපි මේකට Live Progress එක දාමු
        } catch (err) {
          logBox.innerHTML += `<br>❌ Error: ${err.message}`;
          btn.disabled = false;
          btn.textContent = "Start Processing";
        }
      };
    </script>
  </body>
</html>
