<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assign Videos — TIPIZ VPS Admin</title>
    <style>
      body {
        background: #080b14;
        color: #e8ecf5;
        font-family: system-ui, sans-serif;
        padding: 40px 20px;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .card {
        background: #0f1424;
        padding: 30px;
        border-radius: 16px;
        border: 1px solid #1e2a4a;
        flex: 1;
        min-width: 300px;
      }
      h2 {
        color: #4f8cff;
        margin-bottom: 20px;
      }
      select,
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        background: #0a0f1c;
        border: 1px solid #1e2a4a;
        color: white;
        border-radius: 8px;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #4f8cff;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background: #3b7bff;
      }
      .nav-links {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }
      .nav-links a {
        text-decoration: none;
        padding: 10px 20px;
        background: #1e2a4a;
        color: white;
        border-radius: 8px;
        font-size: 14px;
      }
      .nav-links a.active {
        background: #4f8cff;
      }
      #alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        font-weight: 600;
      }
      .success {
        background: rgba(34, 197, 94, 0.2);
        border: 1px solid #22c55e;
        color: #86efac;
      }
      .error {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid #ef4444;
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card" style="flex: 100%">
        <h2>Assign Video to Media</h2>
        <div id="alert"></div>
        <div class="nav-links">
          <a href="/">Process Video</a>
          <a href="/assign.html" class="active">Assign Videos</a>
        </div>
      </div>

      <!-- Form -->
      <div class="card">
        <label>1. Select Uploaded Video (Permanent ID)</label>
        <select id="videoSelect">
          <option value="">Loading videos...</option>
        </select>

        <label>2. Select Target Type</label>
        <select id="typeSelect" onchange="loadMediaOptions()">
          <option value="movie">Movie</option>
          <option value="episode">TV Episode</option>
        </select>

        <label>3. Select Target Media</label>
        <select id="mediaSelect">
          <option value="">Select type first</option>
        </select>

        <button onclick="assignVideo()" style="margin-top: 10px">
          Assign Video
        </button>
      </div>
    </div>

    <script>
      let videos = [],
        movies = [],
        tv = [];

      function showAlert(msg, type) {
        const al = document.getElementById("alert");
        al.textContent = msg;
        al.className = type;
        al.style.display = "block";
        setTimeout(() => (al.style.display = "none"), 4000);
      }

      // Load Data
      async function loadData() {
        try {
          const vRes = await fetch("/api/cf/videos").then((r) => r.json());
          videos = vRes.results || [];
          document.getElementById("videoSelect").innerHTML = videos.length
            ? videos
                .map(
                  (v) =>
                    `<option value="${v.id}">${v.title} (${v.id.slice(0, 8)}...)</option>`,
                )
                .join("")
            : '<option value="">No videos found</option>';

          const mRes = await fetch("/api/cf/movies").then((r) => r.json());
          movies = mRes.results || [];

          const tRes = await fetch("/api/cf/tv").then((r) => r.json());
          tv = tRes.results || [];

          loadMediaOptions();
        } catch (e) {
          showAlert("Failed to load data: " + e.message, "error");
        }
      }

      function loadMediaOptions() {
        const type = document.getElementById("typeSelect").value;
        const select = document.getElementById("mediaSelect");

        if (type === "movie") {
          select.innerHTML = movies
            .map(
              (m) =>
                `<option value="${m.id}">${m.title} (ID: ${m.id})</option>`,
            )
            .join("");
        } else {
          select.innerHTML = tv
            .map(
              (s) => `<option value="${s.id}">${s.name} (ID: ${s.id})</option>`,
            )
            .join("");
        }
      }

      async function assignVideo() {
        const videoId = document.getElementById("videoSelect").value;
        const type = document.getElementById("typeSelect").value;
        const targetId = document.getElementById("mediaSelect").value;

        if (!videoId || !targetId)
          return showAlert("Please select all fields", "error");

        try {
          const res = await fetch("/api/cf/assign", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              video_source_id: videoId,
              type,
              target_id: targetId,
            }),
          });
          const data = await res.json();

          if (data.ok) showAlert("✅ Video assigned successfully!", "success");
          else showAlert("❌ Error: " + data.error, "error");
        } catch (e) {
          showAlert("❌ " + e.message, "error");
        }
      }

      loadData();
    </script>
  </body>
</html>
