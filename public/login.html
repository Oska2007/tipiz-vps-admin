<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login — TIPIZ Admin</title>
    <style>
      body {
        background: #080b14;
        color: #e8ecf5;
        font-family: system-ui;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #0f1424;
        padding: 40px;
        border-radius: 16px;
        border: 1px solid #1e2a4a;
        max-width: 400px;
        width: 100%;
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #4f8cff;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        background: #0a0f1c;
        border: 1px solid #1e2a4a;
        color: white;
        border-radius: 8px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #4f8cff;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background: #3b7bff;
      }
      .error {
        color: #fca5a5;
        text-align: center;
        margin-bottom: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Admin Login</h2>
      <div class="error" id="errorMsg">Invalid username or password</div>
      <form action="/login" method="POST">
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Login</button>
      </form>
    </div>
    <script>
      if (window.location.search.includes("error=1")) {
        document.getElementById("errorMsg").style.display = "block";
      }
    </script>
  </body>
</html>
